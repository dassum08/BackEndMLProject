<!DOCTYPE html>
<html>
<head>
    <title>ML Prediction</title>
</head>

<body>

    <h1>Fire Compliance Prediction</h1>

    <label>Smoke Detectors:</label>
    <input id="smokedetector" type="number" step="0.1"><br><br>

    <label>New Batteries:</label>
    <input id="newbatteries" type="number" step="0.1"><br><br>

    <label>ABC Extinguisher:</label>
    <input id="abcextinguisher" type="number" step="0.1"><br><br>

    <label>Clear Exit Routes:</label>
    <input id="clearexitroutes" type="number" step="0.1"><br><br>

    <button onclick="predict()">Predict</button>
	<button onclick="getData()">Values</button>

    <h2 id="result"></h2>
	<div id="output"></div>

    <script>
        async function predict() {

            const data = {
                smoke_detector: Number(document.getElementById("smokedetector").value),
                new_batteries: Number(document.getElementById("newbatteries").value),
                abc_extinguisher: Number(document.getElementById("abcextinguisher").value),
                clear_exit_routes: Number(document.getElementById("clearexitroutes").value)
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("result").innerText =
                "Compliant: " + result.status +
                " | Probability: " +
                (result.probability * 100).toFixed(2) + "%";
        }
		async function getData() {
            try {
                const response = await fetch("/getdata");

                if (!response.ok) {
                    throw new Error("HTTP error: " + response.status);
                }

                const data = await response.json();

                document.getElementById("output").textContent =
					Object.values(data).join(" ");

            } catch (error) {
                console.error(error);
            }
        }
    </script>

</body>
</html>
