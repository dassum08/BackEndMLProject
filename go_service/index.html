<!DOCTYPE html>
<html>
<head>
    <title>ML Prediction</title>
</head>

<body>

    <h1>Iris Prediction</h1>

    <label>Sepal Length:</label>
    <input id="sepalLength" type="number" step="0.1"><br><br>

    <label>Sepal Width:</label>
    <input id="sepalWidth" type="number" step="0.1"><br><br>

    <label>Petal Length:</label>
    <input id="petalLength" type="number" step="0.1"><br><br>

    <label>Petal Width:</label>
    <input id="petalWidth" type="number" step="0.1"><br><br>

    <button onclick="predict()">Predict</button>

    <h2 id="result"></h2>

    <script>
        async function predict() {

            const data = {
                sepal_length: Number(document.getElementById("sepalLength").value),
                sepal_width: Number(document.getElementById("sepalWidth").value),
                petal_length: Number(document.getElementById("petalLength").value),
                petal_width: Number(document.getElementById("petalWidth").value)
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("result").innerText =
                "Class: " + result.class_id +
                " | Probability: " +
                (result.probability * 100).toFixed(2) + "%";
        }
    </script>

</body>
</html>
